name: Pull Request
about: Standard pull request template
body:
  - type: input
    id: issue
    attributes:
      label: Related Issue
      description: "Leave blank if there isn't one."
      placeholder: "Resolves #123"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "One or two sentences: what and why."
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Changes
      value: "-\n-"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Self-reviewed
          required: true
        - label: "Commits are signed off (`git commit -s`) per the DCO, see CONTRIBUTING.md"
          required: true
        - label: Builds cleanly (`dotnet build`)
        - label: Docs updated (if applicable)
