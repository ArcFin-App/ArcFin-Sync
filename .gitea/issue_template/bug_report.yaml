name: 🐛 Bug Report
about: Report something that's broken or not working as expected
labels:
  - "Kind/Bug"
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here, see [SECURITY.md](../../src/branch/main/SECURITY.md) and email instead.

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Brief description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Jellyfin Server Version
      placeholder: e.g. 10.9.11
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Arcfin Sync Version
      description: Dashboard > Plugins > Arcfin Sync
      placeholder: e.g. 0.1.0.0
    validations:
      required: true

  - type: dropdown
    id: server-os
    attributes:
      label: Server OS / Deployment
      options:
        - Docker
        - Linux
        - Windows
        - macOS
        - Synology
        - Unraid
        - Other
    validations:
      required: true

  - type: dropdown
    id: client-platform
    attributes:
      label: Arcfin Client Platform (if relevant)
      options:
        - N/A
        - iPhone
        - iPad
        - Mac
        - Apple TV

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Server logs, screenshots, config used, anything else relevant.
