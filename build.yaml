name: "Arcfin Sync"
guid: "f3a1c9d2-6b4e-4a7f-9c3d-1e2f3a4b5c6d"
version: "0.4.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "psmattas"
overview: "Syncs Arcfin app settings across devices and adds notification support to Jellyfin."
description: "Syncs Arcfin app settings across a user's devices, scoped by platform. Gives the admin lock, unlock, and prefill control per setting from the Jellyfin dashboard. Adds notifications for new media, admin announcements, and Seerr request availability."
category: "General"
artifacts:
  - "Jellyfin.Plugin.ArcfinSync.dll"
changelog: |
  - Added GET /ArcfinSync/Encoders: which video encoders (h264, hevc, av1) work with
    the server's hardware acceleration setting, from a one-frame test encode per codec
    with the server's own ffmpeg and device. Kept until the setting changes;
    ?refresh=true tests again. Arcfin uses it to ask for AV1 only where the card
    can encode it (a Pascal card, for one, has an AV1 encoder in ffmpeg but can't).
