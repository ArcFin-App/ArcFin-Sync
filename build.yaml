framework: "net10.0"
owner: "psmattas"
overview: "Syncs Arcfin app settings across a user's devices, with admin defaults and locks."
description: "Keeps each user's Arcfin settings in step across their devices and keeps a record of those devices. Administrators set defaults and locks per setting, for everyone or for one user, from the Jellyfin dashboard. Also runs Pick Together sessions and watch parties, Seerr and TMDB through the server, signed security commands, watch-time limits, household features, notifications and Arcs (each off until an administrator turns it on), extracts single audio tracks for Arcfin downloads and reports which video encoders the server's hardware can use."
category: "General"
artifacts:
  - "Jellyfin.Plugin.ArcfinSync.dll"
changelog: |
  - Arcs: short scenes from the server's films and episodes, picked for each person and played in a vertical feed in Arcfin on iPhone and iPad. Clips start at chapters, at cold opens, or at scene changes the Arcs scene index finds, skipping intros and credits, and are spoiler-safe by default. Recommendations learn from watch history, likes, watch time and favourites. Dialogue search, moods and reactions, best scenes for a title, friend codes for sending scenes to each other, request trailers through Seerr (which people or the administrator can turn off), personal stats and a clip of the day. Clips stream as HLS, made with Jellyfin's ffmpeg on the NVIDIA GPU (with HDR tone mapping) when Jellyfin uses NVENC, and on the CPU otherwise. The scene index decodes keyframes only, on the GPU too, with a setting for how many titles it scans at once. Off until an administrator turns it on, on the new Arcs tab.
