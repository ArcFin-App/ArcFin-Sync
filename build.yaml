name: "Arcfin Sync"
guid: "f3a1c9d2-6b4e-4a7f-9c3d-1e2f3a4b5c6d"
version: "0.7.1.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "psmattas"
overview: "Syncs Arcfin app settings across a user's devices, with admin defaults and locks."
description: "Keeps each user's Arcfin settings in step across their devices and keeps a record of those devices. Administrators set defaults and locks per setting, for everyone or for one user, from the Jellyfin dashboard. Also runs Pick Together sessions and watch parties, Seerr and TMDB through the server, signed security commands, watch-time limits, household features and notifications (each off until an administrator turns it on), extracts single audio tracks for Arcfin downloads and reports which video encoders the server's hardware can use."
category: "General"
artifacts:
  - "Jellyfin.Plugin.ArcfinSync.dll"
changelog: |
  - Settings catalogue: Arcfin's music visualizer settings, Visualizer Style (Bars, Wave, Mirrored or Dots), Visualizer Placement (On the Cover or Bottom of the Player) and Visualizer Colour (From the Cover, Cover Colours, Spectrum or White Glass), which administrators can set defaults for and lock. They replace Colour from Cover.
