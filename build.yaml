name: "Arcfin Sync"
guid: "f3a1c9d2-6b4e-4a7f-9c3d-1e2f3a4b5c6d"
version: "0.4.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "psmattas"
overview: "Syncs Arcfin app settings across devices and adds notification support to Jellyfin."
description: "Syncs Arcfin app settings across a user's devices, scoped by platform. Gives the admin lock, unlock, and prefill control per setting from the Jellyfin dashboard. Adds notifications for new media, admin announcements, and Seerr request availability."
category: "General"
artifacts:
  - "Jellyfin.Plugin.ArcfinSync.dll"
changelog: |
  - Settings v2 (API version 2): the plugin carries Arcfin's settings catalogue and
    serves it at GET /ArcfinSync/Schema; GET/PUT Sync with where each value comes
    from and which device changed it last; a record of each user's Arcfin devices
    (name, platform, app version, sync mode, settings) that users can rename and
    forget; server-wide and per-user defaults and locks for administrators.
  - One new configuration page with Overview, Settings, Users & Devices,
    Notifications & Seerr and Advanced tabs.
  - GET/PUT Settings are unchanged for released apps; 0.3 locks and defaults are
    migrated and kept written so going back to 0.3.1 keeps them.
