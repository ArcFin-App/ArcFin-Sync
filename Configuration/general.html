<div id="ArcfinSyncGeneralPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="ArcfinSyncGeneralForm">
                <div class="verticalSection">
                    <h2>Arcfin Sync — General</h2>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input is="emby-checkbox" type="checkbox" id="NotificationsEnabled" />
                            <span>Enable notifications</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">New media, admin announcements, and Seerr request availability.</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input is="emby-checkbox" type="checkbox" id="SeerrWebhookEnabled" />
                            <span>Enable Seerr webhook</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Accepts a webhook from Seerr to notify users when a requested title becomes available.</div>
                    </div>

                    <div class="inputContainer">
                        <input is="emby-input" type="text" id="SeerrWebhookSecret" label="Seerr webhook secret" />
                        <div class="fieldDescription">Set this same value in Seerr's webhook notification settings.</div>
                    </div>

                    <br />
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var pluginId = "f3a1c9d2-6b4e-4a7f-9c3d-1e2f3a4b5c6d";

            document.querySelector("#ArcfinSyncGeneralPage")
                .addEventListener("pageshow", function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        document.querySelector("#NotificationsEnabled").checked = config.NotificationsEnabled;
                        document.querySelector("#SeerrWebhookEnabled").checked = config.SeerrWebhookEnabled;
                        document.querySelector("#SeerrWebhookSecret").value = config.SeerrWebhookSecret || "";
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector("#ArcfinSyncGeneralForm")
                .addEventListener("submit", function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.NotificationsEnabled = document.querySelector("#NotificationsEnabled").checked;
                        config.SeerrWebhookEnabled = document.querySelector("#SeerrWebhookEnabled").checked;
                        config.SeerrWebhookSecret = document.querySelector("#SeerrWebhookSecret").value;
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });
        })();
    </script>
</div>
